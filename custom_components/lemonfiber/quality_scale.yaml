# Home Assistant's integration quality scale, every rule through Platinum (F12-R12).
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling:
    status: done
    comment: The dashboard arrives on the event stream; the doctor's findings are read hourly and when the stack's health moves.
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      The client is sdk-python, vendored byte for byte at a commit of its public repository
      and checked against that commit and against its main branch in CI. It is not published
      to a package registry.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: Every entity is a coordinator entity; the coordinators hold the subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A stack is reached only with a key its operator mints and pastes, so there is nothing to discover it by.
  discovery-update-info:
    status: exempt
    comment: A stack is reached only with a key its operator mints and pastes, so there is nothing to discover it by.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: An entry is one stack, and the stack is its one device.
  entity-category:
    status: done
    comment: Every entity is a primary reading of the stack.
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: An entry is one stack, and the stack is its one device, removed with the entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
