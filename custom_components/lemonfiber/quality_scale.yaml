# Home Assistant's integration quality scale, every rule through Platinum (F12-R12).
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling:
    status: done
    comment: The dashboard arrives on the event stream; the doctor's findings are read hourly and when the stack's health moves.
  brands:
    status: done
    comment: The icon and logo are in brand/, copied from the brand repository's exports of the marks.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      The client is sdk-python, vendored byte for byte at a commit of its public repository
      and checked against that commit and against its main branch in CI. It is not published
      to a package registry.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: Every entity is a coordinator entity; the coordinators hold the subscriptions, and the alerts entity subscribes to the stream's alerts when added and lets go when removed.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A stack is reached only with a key its operator mints and pastes, so there is nothing to discover it by.
  discovery-update-info:
    status: exempt
    comment: A stack is reached only with a key its operator mints and pastes, so there is nothing to discover it by.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: An entry is one stack, and the stack is its one device.
  entity-category:
    status: done
    comment: The restart buttons are configuration; every other entity is a primary reading or control of the stack.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      Advisory findings, advice rather than anything wrong, are counted by an entity left off
      until enabled, and each service's restart button and update entity are left off beside the
      stack's own.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: A changed certificate, something other than lemonfiber at the address, and another interface version are raised as repairs until setup next reaches the stack.
  stale-devices:
    status: exempt
    comment: An entry is one stack, and the stack is its one device, removed with the entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
