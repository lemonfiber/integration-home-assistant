# Stale issues and pull requests, on the org's one definition. OPS-R15.
name: stale
on:
  schedule:
    - cron: "45 1 * * *"
permissions:
  contents: read

jobs:
  stale:
    permissions:
      contents: read
      issues: write
      pull-requests: write
