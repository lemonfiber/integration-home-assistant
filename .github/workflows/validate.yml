# Home Assistant's and HACS's own checks of the integration (F12-R13).
#
# `hassfest` is Home Assistant's validation of an integration's manifest,
# translations, config flow and icons, the one its own integrations meet. The
# HACS action is what HACS checks before it installs a repository.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, because both checks move with Home Assistant and HACS rather than
    # with this repository.
    - cron: "10 6 * * 3"

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether this change reaches anything either check reads, asked of the script
  # `ci.yml`'s `what changed` asks, so the two cannot disagree about a path.
  # `hacs` reads the readme as well, so it has an answer of its own. Each check
  # skips where its answer is no, and runs wherever this job did not succeed.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
      hacs: ${{ steps.diff.outputs.hacs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the base is here to compare against, and no file
          # contents but the checkout's: the comparison reads trees, and the
          # workflow lines it reads are fetched when it asks for them.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          # A pull request's base, or on a push the commit before it. A schedule
          # has none, and the answer is then that both checks run.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/the_code_a_change_touches.py "${BASE}"

  hassfest:
    name: hassfest
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    name: hacs
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.hacs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `brands` and `topics` are set where the repository is described rather
      # than in this tree: the integration's icon in Home Assistant's brands
      # repository, and the repository's topics on GitHub. `license` admits a
      # license GitHub names by its SPDX identifier, and the Hippocratic License
      # 3.0 this repository carries has none; HACS installs a custom repository
      # whatever its license.
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands license topics
          # The verdict is this check's; it writes nothing on the pull request.
          comment: "false"
