# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree and
# reads the coverage report its `coverage` job wrote.
sonar.projectKey=lemonfiber_integration-home-assistant
sonar.organization=lemonfiber

# `tests/` is the suite, named so the rules Sonar scopes to production code stay
# pointed at the integration and `scripts/`. A file claimed as both source and
# test is indexed twice and the analysis produces nothing, so `tests/` is also
# excluded from the sources.
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.14

# `custom_components/lemonfiber/_vendor/**` is sdk-python, copied byte for byte
# and analysed in its own repository; `scripts/vendor_sdk.py check` fails on any
# change to it here. `typings/` holds type stubs for the test harness.
# `scripts/no_open_codeql_alert.py` is the spec's shared gate, byte-identical to
# its home copy and analysed there.
sonar.exclusions=tests/**,custom_components/lemonfiber/_vendor/**,typings/**,scripts/no_open_codeql_alert.py

# The coverage report is named by `sonar.yml`, which passes the scanner its path
# outside the workspace. It is written by `just coverage`, the run that holds the
# suite to 100% line and branch coverage.
